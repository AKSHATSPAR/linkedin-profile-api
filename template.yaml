AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Public, rate-limited LinkedIn profile normalization API

Parameters:
  LinkedInSecretArn:
    Type: String
    Description: ARN of the Secrets Manager JSON secret containing li_at and jsessionid
    NoEcho: true

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        LINKEDIN_SECRET_ARN: !Ref LinkedInSecretArn
        LINKEDIN_REQUEST_TIMEOUT_SECONDS: "6"
        LINKEDIN_TOTAL_TIMEOUT_SECONDS: "10"
        LINKEDIN_MAX_RETRIES: "0"
        LINKEDIN_MAX_UPSTREAM_REQUESTS: "6"
        LINKEDIN_MAX_RESPONSE_BYTES: "2000000"
        LINKEDIN_FETCH_SECTION_FALLBACKS: "false"
        ALLOW_CONTACT_INFO: "false"
        CACHE_TTL_SECONDS: "300"
        CACHE_MAX_ENTRIES: "128"
        RATE_LIMIT_PER_MINUTE: "10"
        RATE_LIMIT_MAX_CLIENTS: "2048"
        MAX_REQUEST_BODY_BYTES: "4096"

Resources:
  ProfileApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1
      RouteSettings:
        "GET /v1/profiles":
          ThrottlingBurstLimit: 1
          ThrottlingRateLimit: 0.05
        "POST /v1/profiles":
          ThrottlingBurstLimit: 1
          ThrottlingRateLimit: 0.05

  ProfileFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64
    Properties:
      CodeUri: .
      Handler: linkedin_profile_api.lambda_handler.handler
      Description: Normalizes LinkedIn profile data visible to a configured session
      ReservedConcurrentExecutions: 1
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref LinkedInSecretArn
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProfileApi
            Path: /
            Method: ANY
            PayloadFormatVersion: "2.0"
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProfileApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"
        ProfileGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProfileApi
            Path: /v1/profiles
            Method: GET
            PayloadFormatVersion: "2.0"
        ProfilePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProfileApi
            Path: /v1/profiles
            Method: POST
            PayloadFormatVersion: "2.0"

Outputs:
  ApiUrl:
    Description: Public base URL
    Value: !Sub https://${ProfileApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ProfileFunction.Arn
